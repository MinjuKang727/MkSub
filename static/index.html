<html>
    <head>
        <meta charset="UTF-8">
        <title>노래방 자막 만들기</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>노래방 자막 만들기</h1>
        <p>유튜브에서 노래를 검색하여 자막을 다운로드하고, 자막을 편집하여 노래방 자막을 만드는 웹 페이지입니다.</p>
        <div class="container">
            <div class="input-section">
                <h2>유튜브 링크 입력</h2>
                <input type="text" id="youtube-url" placeholder="유튜브 링크를 입력하세요">
                <button id="download-btn">다운로드</button>
            </div>
            <div class="output-section">
                <h2>다운로드된 자막</h2>
                <pre id="subtitle-output"></pre>
            </div>
        </div>
        <script src="script.js"></script>
</html>
